# Recreate the original pretrain-origin 2K warmup with the full ten-epoch LR horizon.
defaults:
  - train_sidecar_patchwam_warmstart_8gpu_10epochs
  - _self_

model:
  architecture:
    relational_sidecar:
      backbone_warmup_updates: 2000

training:
  batch_size: 32
  gradient_accumulation_steps: 2
  sidecar_lr_screen: null
  stop_after_optimizer_updates: 2000
  save_optimizer_steps: 2000
  save_full_states_for_resume: false
  keep_final_resume_state: false
  keep_last_k_ckpts: 2
  output_path: outputs/sidecar/grounded_read_warmup2k
