# Reload the new 2K weights into a fresh optimizer; all peak LRs are 1/4 of the prior run.
defaults:
  - train_sidecar_patchwam_warmstart_8gpu_10epochs
  - _self_

training:
  num_epochs: 5
  max_steps: null
  learning_rate: 2.5e-5
  action_lr: 2.5e-5
  video_lr: 2.5e-5
  sidecar_lr: 1.25e-5
  sidecar_lr_screen: null
  save_steps: 2000
  save_full_states_for_resume: false
  keep_final_resume_state: false
  keep_last_k_ckpts: 6  # 2K/4K/6K/8K/10K/final; preserve the separate warmup run.
  output_path: outputs/sidecar/c2r_sidecar_joint5ep_8gpu
