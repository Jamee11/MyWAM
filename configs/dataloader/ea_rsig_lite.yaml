type: ea_rsig_lite
manifest_path: ${oc.env:EA_LITE_MANIFEST,outputs/ea_lite/data/manifest.ready.json}
startup_mode: prepared  # prepared: offline metadata; scan: original exhaustive discovery
tasks: null
auxiliary: true
variant: clean_50
action_mode: eef
unify_action: true
unify_action_map: ["0-9", "34-43"]
unify_state_map: null
normalize_mode: min-max
num_frames: 33
video_stride: 4
window_stride: 1
height: 384
width: 320
multiview: true
camera_layout: [head_camera, left_camera, right_camera]
color_jitter:
  enabled: true  # Clean2Random paper protocol; use the same augmentation for A/B/C.
  brightness: 0.2
  contrast: 0.2
  saturation: 0.2
  hue: 0.0
